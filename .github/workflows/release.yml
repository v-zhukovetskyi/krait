name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            artifact_name: krait-linux-x86_64

          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: krait-windows-x86_64.exe

          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: krait-macos-arm64

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package artifact
        shell: bash
        run: |
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            cp "target/${{ matrix.target }}/release/krait.exe" "${{ matrix.artifact_name }}"
          else
            cp "target/${{ matrix.target }}/release/krait" "${{ matrix.artifact_name }}"
          fi

      - name: Upload binaries to Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifact_name }}
