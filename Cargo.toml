[package]
name = "banded-krait"
version = "0.1.0"
edition = "2024"
authors = ["Valentyn Zhukovetskyi <zukovetski@gmail.com>"]
description = "GPU-Accelerated DNA Sequence Aligner for short reads using WebGPU"
license = "AGPL-3.0-or-later"
repository = "https://github.com/v-zhukovetskyi/krait"

[[bin]]
name = "krait"
path = "src/main.rs"

[dependencies]
wgpu = "^30.0"
bytemuck = { version = "^1", features = ["derive"] }
clap = { version = "^4.6.7", features = ["derive"] }
flate2 = { version = "^1", features = ["zlib-rs"], default-features = false }
rayon = "^1"
indicatif = "^0.18"
fxhash = "^0.2"
fearless_simd = "^1.2.0"

noodles-bam = "^0.91.0"
noodles-bgzf = "^0.52"
soa_derive = "^0.14"
crossbeam = "^0.8"
pollster = "^1.0"
memchr = "2.8.3"

[profile.profiling]
inherits = "release"
debug = true
