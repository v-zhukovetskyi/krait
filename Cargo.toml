[package]
name = "banded-krait"
version = "0.1.0"
edition = "2024"
authors = ["Valentyn Zhukovetskyi <zukovetski@gmail.com>"]
description = "GPU-Accelerated DNA Sequence Aligner for short reads using WebGPU"
license = "AGPL-3.0-or-later"
repository = "https://github.com/ваш-логин/krait"

[[bin]]
name = "krait"
path = "src/main.rs"

[dependencies]
wgpu = "30.0"
tokio = { version = "1.53.3", features = ["full"] }
bytemuck = { version = "1", features = ["derive"] }
bio = "4.2"
clap = { version = "4", features = ["derive"] }
flate2 = { version = "1", features = ["zlib-rs"], default-features = false }
rayon = "1"
indicatif = "0.18"
fxhash = "0.2"
fearless_simd = "1.1.0"
rustc-hash = "2.1"
noodles = { version = "0.118", features = ["sam", "bam"] }
# Для тонкого управления пулом сжатия под капотом noodles использует:
noodles-bam = { version = "0.97", features = ["async"] }
noodles-bgzf = { version = "0.52", features = ["libdeflate"] }

[profile.release]
debug = true
